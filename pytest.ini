[pytest]
# Pytest configuration for OANDA MCP Server tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Markers for organizing tests
markers =
    async: marks tests as async (deselect with '-m "not async"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    health: marks tests as health check tests
    account: marks tests as account endpoint tests
    orders: marks tests as order endpoint tests
    trades: marks tests as trade endpoint tests
    mcp: marks tests as MCP tools tests

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --code-highlight=yes

# Coverage options
testpaths = tests

# Asyncio mode
asyncio_mode = auto

# Timeout for tests (in seconds)
timeout = 30

# Enable logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Warnings to treat as errors
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pluggy.PluggyTeardownRaisedWarning
