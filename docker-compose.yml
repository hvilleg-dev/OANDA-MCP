version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: oanda-db
    environment:
      POSTGRES_USER: oanda
      POSTGRES_PASSWORD: oanda
      POSTGRES_DB: oanda_mcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oanda -d oanda_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  oanda-mcp:
    build: .
    container_name: oanda-mcp-server
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://oanda:oanda@db:5432/oanda_mcp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
